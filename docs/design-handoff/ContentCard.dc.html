<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="display:flex;flex-direction:column;gap:10px;width:100%;cursor:pointer" onClick="{{handleClick}}">
  <div style="position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#1c1a24;box-shadow:0 1px 2px rgba(0,0,0,0.4)" style-hover="transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,0.5)">
    <sc-if value="{{item.poster}}" hint-placeholder-val="{{true}}">
      <image-slot id="poster-{{item.id}}" shape="rect" placeholder="{{item.title}}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot>
    </sc-if>
    <sc-if value="{{item.noPoster}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#211c2c,#1c1a24);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center">
        <div style="font-size:9px;font-weight:600;letter-spacing:1.2px;color:rgba(245,243,247,0.28);text-transform:uppercase">포스터 준비중</div>
        <div style="font-size:13px;font-weight:700;color:rgba(245,243,247,0.72);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{item.title}}</div>
        <div style="font-size:10px;color:rgba(245,243,247,0.32)">{{item.leadsText}}</div>
      </div>
    </sc-if>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,15,0) 55%,rgba(11,10,15,0.75) 100%);pointer-events:none"></div>
    <div style="position:absolute;top:8px;left:8px;display:flex;gap:6px;pointer-events:none">
      <span style="font-size:11px;font-weight:600;color:#f5f3f7;background:rgba(11,10,15,0.6);border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:3px 9px;backdrop-filter:blur(4px)">{{item.category}}</span>
      <sc-if value="{{item.juice}}" hint-placeholder-val="{{false}}">
        <span style="font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#E5486B,#C93356);border-radius:20px;padding:3px 9px">착즙</span>
      </sc-if>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <div style="font-size:14px;font-weight:600;color:#f5f3f7;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{item.title}}</div>
    <div style="font-size:12px;color:rgba(245,243,247,0.5)">{{item.year}} · {{item.creatorName}}</div>
    <div style="font-size:11px;color:rgba(245,243,247,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">출연 {{item.leadsText}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:190},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const item = this.props.item || {};
    const onClick = this.props.onClick;
    return {
      item,
      handleClick: () => { if (onClick) onClick(item.id); }
    };
  }
}
</script>
</body>
</html>
